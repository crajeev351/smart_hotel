apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: smarthotel
    service: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smarthotel
      service: backend
  template:
    metadata:
      labels:
        app: smarthotel
        service: backend
    spec:
      initContainers:
        - name: run-migrations
          image: smarthotel-backend:latest  # Replace with your Docker Registry image tag (e.g. gcr.io/project/backend)
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "migrate"]
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: smarthotel-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: smarthotel-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smarthotel-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: smarthotel-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: smarthotel-config
                  key: DB_PORT
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: smarthotel-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: smarthotel-config
                  key: REDIS_PORT
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: smarthotel-secrets
                  key: SECRET_KEY
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: smarthotel-config
                  key: DEBUG
      containers:
        - name: backend
          image: smarthotel-backend:latest  # Replace with your Docker Registry image tag
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: smarthotel-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: smarthotel-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smarthotel-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: smarthotel-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: smarthotel-config
                  key: DB_PORT
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: smarthotel-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: smarthotel-config
                  key: REDIS_PORT
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: smarthotel-secrets
                  key: SECRET_KEY
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: smarthotel-config
                  key: DEBUG
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app: smarthotel
    service: backend
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: smarthotel
    service: backend
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  labels:
    app: smarthotel
    service: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
