services:
  - type: web
    name: smarthotel-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: Dockerfile
    dockerCommand: sh -c "python manage.py migrate && gunicorn --bind 0.0.0.0:8000 config.wsgi:application"
    plan: free
    envVars:
      - key: POSTGRES_DB
        value: smarthotel
      - key: POSTGRES_USER
        value: smarthotel_user
      - key: POSTGRES_PASSWORD
        generateValue: true
      - key: DB_HOST
        fromDatabase:
          name: smarthotel-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: smarthotel-postgres
          property: port
      - key: REDIS_HOST
        fromService:
          type: redis
          name: smarthotel-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: smarthotel-redis
          property: port
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"

  - type: web
    name: smarthotel-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: Dockerfile
    plan: free

databases:
  - name: smarthotel-postgres
    databaseName: smarthotel
    user: smarthotel_user
    plan: free
